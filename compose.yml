name: "atlassian"

x-jira: &jira
  image: "atlassian/jira-software:${JIRA_VERSION:?Set JIRA_VERSION}"
  restart: "unless-stopped"
  environment: &jira-env
    TZ: "${TZ}"
    CLUSTERED: "true"
    JIRA_SHARED_HOME: "/var/atlassian/shared/jira"

    ATL_DB_TYPE: "postgres72"
    ATL_DB_DRIVER: "org.postgresql.Driver"
    ATL_JDBC_URL: "jdbc:postgresql://postgres:5432/${JIRA_DB}"
    ATL_JDBC_USER: "${JIRA_DB_USER}"
    ATL_JDBC_PASSWORD: "${JIRA_DB_PASSWORD:?Set JIRA_DB_PASSWORD}"

    JVM_MINIMUM_MEMORY: "${JIRA_MIN_HEAP}"
    JVM_MAXIMUM_MEMORY: "${JIRA_MAX_HEAP}"

    ATL_PROXY_NAME: "${JIRA_DOMAIN}"
    ATL_PROXY_PORT: "443"
    ATL_TOMCAT_SCHEME: "https"
    ATL_TOMCAT_SECURE: "true"
  networks:
    - "atlassian"

x-confluence: &confluence
  image: "atlassian/confluence:${CONFLUENCE_VERSION:?Set CONFLUENCE_VERSION}"
  restart: "unless-stopped"
  environment: &confluence-env
    TZ: "${TZ}"
    ATL_CLUSTER_TYPE: "tcp_ip"
    ATL_CLUSTER_NAME: "${CONFLUENCE_CLUSTER_NAME}"
    ATL_CLUSTER_PEERS: "10.50.50.21,10.50.50.22"
    ATL_PRODUCT_HOME_SHARED: "/var/atlassian/shared/confluence"

    ATL_DB_TYPE: "postgresql"
    ATL_JDBC_URL: "jdbc:postgresql://postgres:5432/${CONFLUENCE_DB}"
    ATL_JDBC_USER: "${CONFLUENCE_DB_USER}"
    ATL_JDBC_PASSWORD: "${CONFLUENCE_DB_PASSWORD:?Set CONFLUENCE_DB_PASSWORD}"

    JVM_MINIMUM_MEMORY: "${CONFLUENCE_MIN_HEAP}"
    JVM_MAXIMUM_MEMORY: "${CONFLUENCE_MAX_HEAP}"

    ATL_PROXY_NAME: "${CONFLUENCE_DOMAIN}"
    ATL_PROXY_PORT: "443"
    ATL_TOMCAT_SCHEME: "https"
    ATL_TOMCAT_SECURE: "true"
  networks:
    atlassian:

x-bitbucket: &bitbucket
  image: "atlassian/bitbucket:${BITBUCKET_VERSION:?Set BITBUCKET_VERSION}"
  restart: "unless-stopped"
  environment: &bitbucket-env
    TZ: "${TZ}"

    JDBC_DRIVER: "org.postgresql.Driver"
    JDBC_URL: "jdbc:postgresql://postgres:5432/${BITBUCKET_DB}"
    JDBC_USER: "${BITBUCKET_DB_USER}"
    JDBC_PASSWORD: "${BITBUCKET_DB_PASSWORD:?Set BITBUCKET_DB_PASSWORD}"

    HAZELCAST_NETWORK_TCPIP: "true"
    HAZELCAST_NETWORK_TCPIP_MEMBERS: "10.50.50.31:5701,10.50.50.32:5701"
    HAZELCAST_GROUP_NAME: "${BITBUCKET_CLUSTER_NAME}"
    HAZELCAST_GROUP_PASSWORD: "${BITBUCKET_CLUSTER_PASSWORD:?Set cluster password}"

    SERVER_PROXY_NAME: "${BITBUCKET_DOMAIN}"
    SERVER_PROXY_PORT: "443"
    SERVER_SCHEME: "https"
    SERVER_SECURE: "true"

    SEARCH_ENABLED: "false"
  networks:
    atlassian:

services:

  # ========================================
  # PostgreSQL
  # ========================================
  postgres:
    image: "postgres:${POSTGRES_VERSION}"
    restart: "unless-stopped"
    environment:
      TZ: "${TZ}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_DB: "postgres"

      JIRA_DB: "${JIRA_DB}"
      JIRA_DB_USER: "${JIRA_DB_USER}"
      JIRA_DB_PASSWORD: "${JIRA_DB_PASSWORD}"

      CONFLUENCE_DB: "${CONFLUENCE_DB}"
      CONFLUENCE_DB_USER: "${CONFLUENCE_DB_USER}"
      CONFLUENCE_DB_PASSWORD: "${CONFLUENCE_DB_PASSWORD}"

      BITBUCKET_DB: "${BITBUCKET_DB}"
      BITBUCKET_DB_USER: "${BITBUCKET_DB_USER}"
      BITBUCKET_DB_PASSWORD: "${BITBUCKET_DB_PASSWORD}"
    volumes:
      - "./data/postgres:/var/lib/postgresql/data"
      - "./data/postgres-init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U $${POSTGRES_USER} -d postgres"
      interval: "10s"
      timeout: "5s"
      retries: 15
    networks:
      - "atlassian"

  # ========================================
  # Jira + JSM
  # ========================================
  jira-1:
    <<: *jira
    environment:
      <<: *jira-env
      JIRA_NODE_ID: "jira-1"
      EHCACHE_LISTENER_HOSTNAME: "jira-1"
      EHCACHE_PEER_DISCOVERY: "default"
    volumes:
      - "./data/jira/node1:/var/atlassian/application-data/jira"
      - "./data/jira/shared:/var/atlassian/shared/jira"
    depends_on:
      postgres:
        condition: "service_healthy"

  jira-2:
    <<: *jira
    environment:
      <<: *jira-env
      JIRA_NODE_ID: "jira-2"
      EHCACHE_LISTENER_HOSTNAME: "jira-2"
      EHCACHE_PEER_DISCOVERY: "default"
    volumes:
      - "./data/jira/node2:/var/atlassian/application-data/jira"
      - "./data/jira/shared:/var/atlassian/shared/jira"
    depends_on:
      postgres:
        condition: "service_healthy"
    profiles:
      - "cluster"
  # ========================================
  # Confluence
  # ========================================
  confluence-1:
    <<: *confluence
    volumes:
      - "./data/confluence/node1:/var/atlassian/application-data/confluence"
      - "./data/confluence/shared:/var/atlassian/shared/confluence"
    networks:
      atlassian:
        ipv4_address: "10.50.50.21"
    depends_on:
      postgres:
        condition: "service_healthy"

  confluence-2:
    <<: *confluence
    volumes:
      - "./data/confluence/node2:/var/atlassian/application-data/confluence"
      - "./data/confluence/shared:/var/atlassian/shared/confluence"
    networks:
      atlassian:
        ipv4_address: "10.50.50.22"
    depends_on:
      postgres:
        condition: "service_healthy"
    profiles:
      - "cluster"

  # ========================================
  # Bitbucket
  # ========================================
  bitbucket-1:
    <<: *bitbucket
    volumes:
      - "./data/bitbucket/node1:/var/atlassian/application-data/bitbucket"
      - "./data/bitbucket/shared:/var/atlassian/application-data/bitbucket/shared"
    networks:
      atlassian:
        ipv4_address: "10.50.50.31"
    depends_on:
      postgres:
        condition: "service_healthy"

  bitbucket-2:
    <<: *bitbucket
    volumes:
      - "./data/bitbucket/node2:/var/atlassian/application-data/bitbucket"
      - "./data/bitbucket/shared:/var/atlassian/application-data/bitbucket/shared"
    networks:
      atlassian:
        ipv4_address: "10.50.50.32"
    depends_on:
      postgres:
        condition: "service_healthy"
    profiles:
      - "cluster"

  # ========================================
  # HAProxy
  # ========================================
  haproxy:
    image: "haproxy:${HAPROXY_VERSION}"
    restart: "unless-stopped"
    ports:
      - "${HAPROXY_HTTP_PORT}:8080"
      - "${BITBUCKET_SSH_PORT}:7999"
    volumes:
      - "./data/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"
    networks:
      - "atlassian"

networks:
  atlassian:
    driver: "bridge"
    ipam:
      config:
        - subnet: "10.50.50.0/24"

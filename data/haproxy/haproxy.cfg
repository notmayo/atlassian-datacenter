global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 10s
    timeout client 300s
    timeout server 300s

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold nx 5s
    hold other 5s
    hold refused 5s
    hold timeout 5s

frontend atlassian
    bind *:8080
    mode http

    acl is_jira hdr(host) -i jira.example.com
    acl is_confluence hdr(host) -i confluence.example.com
    acl is_bitbucket hdr(host) -i bitbucket.example.com

    http-request return status 404 unless is_jira or is_confluence or is_bitbucket

    use_backend jira if is_jira
    use_backend confluence if is_confluence
    use_backend bitbucket if is_bitbucket

backend jira
    balance roundrobin
    cookie NODE insert indirect nocache

    option httpchk
    http-check send meth GET uri /
    http-check expect status 302

    server jira1 jira-1:8080 check cookie j1 resolvers docker init-addr none
    server jira2 jira-2:8080 check cookie j2 resolvers docker init-addr none

backend confluence
    balance roundrobin
    cookie NODE insert indirect nocache
    option httpchk GET /status
    http-check expect status 200
    server conf1 confluence-1:8090 check cookie c1 resolvers docker init-addr none
    server conf2 confluence-2:8090 check cookie c2 resolvers docker init-addr none

backend bitbucket
    balance roundrobin
    cookie NODE insert indirect nocache
    option httpchk GET /status
    http-check expect status 200
    server bitbucket1 bitbucket-1:7990 check cookie b1 resolvers docker init-addr none
    server bitbucket2 bitbucket-2:7990 check cookie b2 resolvers docker init-addr none
